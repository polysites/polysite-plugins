name: CI

# Each plugin's own tests, on their own: a plugin is independent of the Polysite core and needs nothing
# from it to be tested. (The core's checks live in the polysite repository.)
on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test every plugin
        run: |
          status=0
          for dir in */; do
            [ -f "${dir}polysite.plugin.json" ] || continue
            [ -d "${dir}test" ] || { echo "-- ${dir%/}: no tests"; continue; }
            echo "== ${dir%/}"
            (cd "$dir" && { [ -f package-lock.json ] && npm ci --silent --workspaces=false || true; } && node --test test/*.test.js) || status=1
          done
          exit $status
